name: test-coverage

# Coverage reruns the tests under instrumentation; it reports development's
# coverage after each merge and does not gate pull requests.
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up JAGS
        uses: FBartos/BayesTools/.github/actions/setup-jags@development

      - name: Resolve BayesTools source
        id: bayestools
        uses: FBartos/BayesTools/.github/actions/bayestools-source@development

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          cache-version: 3
          install-pandoc: false
          extra-packages: |
            any::covr
            any::posterior
            ${{ steps.bayestools.outputs.pak-spec }}

      - name: Test coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          repo_path <- normalizePath(".", winslash = "/", mustWork = TRUE)
          install_path <- normalizePath(file.path(Sys.getenv("RUNNER_TEMP"), "R_LIBS"), winslash = "/", mustWork = FALSE)
          unlink(install_path, recursive = TRUE, force = TRUE)

          coverage <- covr::package_coverage(
            path         = repo_path,
            quiet        = FALSE,
            clean        = FALSE,
            install_path = install_path
          )
          covr::codecov(coverage = coverage)
        shell: Rscript {0}

      - name: Show testthat output
        if: failure()
        shell: pwsh
        run: |
          $failFiles = Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Filter "*.Rout.fail" -ErrorAction SilentlyContinue
          if ($failFiles) {
            foreach ($file in $failFiles) {
              Write-Host "`n=== Contents of $($file.FullName) ===`n"
              Get-Content $file.FullName
            }
          } else {
            Write-Host "No .Rout.fail files found in $env:RUNNER_TEMP"
          }
