name: R-unit-tests

# Runs the full test suite. post-merge.yaml calls this workflow for Linux.
on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:
  workflow_call:
    inputs:
      matrix:
        description: JSON list of runner configurations, each {"os", "r"}.
        type: string
        required: true

# A called workflow sees the caller's github.workflow: the literal prefix keeps
# two workflows called by one caller apart, github.workflow keeps the callers
# (and a direct run) apart.
concurrency:
  group: R-unit-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 180
    env:
      NOT_CRAN: "true"
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.matrix || '[{"os":"windows-latest","r":"4.6"}]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Set up JAGS
        uses: FBartos/BayesTools/.github/actions/setup-jags@development

      - name: Resolve BayesTools source
        id: bayestools
        uses: FBartos/BayesTools/.github/actions/bayestools-source@development

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          cache-version: 3
          install-pandoc: false
          extra-packages: |
            any::devtools
            any::posterior
            ${{ steps.bayestools.outputs.pak-spec }}

      - name: Verify rjags JAGS runtime
        run: |
          library(rjags)
          rjags::load.module("bugs", quiet = TRUE)
          cat("rjags JAGS runtime OK\n")
        shell: Rscript {0}

      - name: Run Unit Tests
        run: |
          devtools::install(dependencies = FALSE, upgrade = FALSE, build_vignettes = FALSE)
          library(RoBSA)
          RoBSA:::.load_RoBSA_module()
          cat("RoBSA JAGS module OK\n")
          setwd("tests")
          source("testthat.R")
        shell: Rscript {0}
